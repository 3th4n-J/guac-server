services:
  # Guacamole Backend Proxy Daemon
  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: always
    networks:
      - guacamole_net

  # PostgreSQL Database for users and connections
  guacamole-db:
    image: postgres:15-alpine
    container_name: guacamole-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guacamole_db}
      POSTGRES_USER: ${POSTGRES_USER:-guacamole_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe123!}
    volumes:
      - guacamole_db_data:/var/lib/postgresql/data
      # Make sure this line is uncommented so the schema is created!
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    networks:
      - guacamole_net

  # Guacamole Web Application
  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    restart: always
    ports:
      - "${GUACAMOLE_PORT:-8080}:8080"
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      # Notice the "QL" in these variables for the web app
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-guacamole_db}
      POSTGRESQL_USER: ${POSTGRES_USER:-guacamole_user}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe123!}
      POSTGRESQL_HOSTNAME: guacamole-db
    depends_on:
      - guacd
      - guacamole-db
    networks:
      - guacamole_net

volumes:
  guacamole_db_data:

networks:
  guacamole_net:
    driver: bridge